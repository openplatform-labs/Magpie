services:
  db:
    image: postgres:19rc2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MAGPIE_ADMIN_TOKEN: ${MAGPIE_ADMIN_TOKEN:-}
      MAGPIE_ALLOWED_PROVIDER_BASES: ${MAGPIE_ALLOWED_PROVIDER_BASES:-}
      MAGPIE_PROVIDER_TIMEOUT_SECONDS: ${MAGPIE_PROVIDER_TIMEOUT_SECONDS:-60}
      MAGPIE_ENCRYPTION_KEY: ${MAGPIE_ENCRYPTION_KEY:?Set MAGPIE_ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  postgres_data:
