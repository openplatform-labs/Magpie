# Docker service DNS supplies container addresses; it is not a health-aware load balancer.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream magpie_backend {
  zone magpie_backend 64k;
  server backend:8000 resolve;
}
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  client_header_timeout 15s;
  client_body_timeout 15s;
  proxy_next_upstream off;
  location /api/ { proxy_pass http://magpie_backend; }
  # Old identity providers may still redirect here with a code in the query.
  location = /oidc/callback { access_log off; return 410; }
  location /auth/ { proxy_pass http://magpie_backend; }
  location /admin/ { proxy_pass http://magpie_backend; }
  # Allow two configured provider attempts (up to 3600s each) plus DB overhead.
  location /v1/ { proxy_pass http://magpie_backend; proxy_buffering off; proxy_read_timeout 7500s; }
  location /health/ { proxy_pass http://magpie_backend; }
  location / { try_files $uri $uri/ /index.html; }
}
