# TLS terminates here; Docker DNS does not provide health-aware routing.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream magpie_backend {
  zone magpie_backend 64k;
  server backend:8000 resolve;
}
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /run/magpie-tls/cert.pem;
  ssl_certificate_key /run/magpie-tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  client_header_timeout 15s;
  client_body_timeout 15s;
  proxy_next_upstream off;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ { proxy_pass http://magpie_backend; }
  # No per-location add_header: it would override the server security headers.
  location = /oidc/callback { access_log off; try_files /index.html =404; }
  location /auth/ { proxy_pass http://magpie_backend; }
  location /admin/ { proxy_pass http://magpie_backend; }
  # Allow two configured provider attempts (up to 3600s each) plus DB overhead.
  location /v1/ { proxy_pass http://magpie_backend; proxy_buffering off; proxy_read_timeout 7500s; }
  location /health/ { proxy_pass http://magpie_backend; }
  location / { try_files $uri $uri/ /index.html; }
}
