name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19rc2
        env:
          POSTGRES_USER: magpie
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: magpie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magpie -d magpie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://magpie:ci-test-password@localhost:5432/magpie
      MAGPIE_ADMIN_TOKEN: ci-test-admin-token-at-least-thirty-two-characters
      MAGPIE_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.7
      - run: python tests/check_requirements.py
      - run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: PYTHONPATH=. uv run python tests/postgres_smoke.py
      - run: PYTHONPATH=. uv run python tests/price_migration.py
      - run: PYTHONPATH=. MAGPIE_SOAK_SECONDS=5 uv run python tests/load_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node tests/run-session-test.cjs
      - run: TZ=America/New_York node tests/run-session-test.cjs
      - run: npm run build
      - run: python3 tests/check_csp.py

  multi-instance:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: magpie
      POSTGRES_USER: magpie
      POSTGRES_PASSWORD: ci-test-password
      DATABASE_URL: postgresql+psycopg://magpie:ci-test-password@db:5432/magpie
      MAGPIE_ADMIN_TOKEN: ci-test-admin-token-at-least-thirty-two-characters
      MAGPIE_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - run: docker compose run -T --rm --no-deps backend python -c 'import os, pwd; assert os.geteuid() == 10001 and os.access(pwd.getpwuid(os.geteuid()).pw_dir, os.W_OK) and not os.access("/app/app/main.py", os.W_OK)'
      - run: docker compose run -T --rm --no-deps backend python -m pip check
      - run: docker compose run -T --rm --no-deps backend python -c 'from pathlib import Path; import app.main; base = Path("/usr/local/lib/python3.13/site-packages/litellm"); assert all(not (base / path).exists() for path in ("proxy/_experimental/out", "proxy/a2a", "proxy/agent_endpoints", "a2a_protocol"))'
      - run: docker compose run -T --rm --no-deps backend python -c 'from pathlib import Path; base = Path("/usr/local/lib/python3.13/site-packages/litellm/proxy"); assert (base / "mcp_server/stdio_gate.py").is_file(); assert {p.name for p in (base / "mcp_server").iterdir()} == {"stdio_gate.py"}; assert all(not (base / name).exists() for name in ("admin_mcp.py", "mcp_registry.json", "mcp_tools.py"))'
      - run: docker build -f backend/tests/Dockerfile.contract -t magpie-contract-test .
      - run: docker run --rm --network none -v "$PWD:/workspace:ro" magpie-contract-test python -m pytest -q --import-mode=importlib /workspace/backend/tests/test_api.py /workspace/backend/tests/test_native_provider_contracts.py --disable-warnings
      - run: sh backend/tests/bootstrap_retire.sh
      - run: MAGPIE_HA_SOAK_SECONDS=5 sh backend/tests/ha_load.sh
      - run: sh backend/tests/provider_stall.sh
      - run: sh backend/tests/db_failure.sh
      - run: sh backend/tests/tls_smoke.sh
      - run: sh backend/tests/backup_restore.sh
      - run: sh backend/tests/postgres_upgrade.sh postgres:18 postgres:19rc2
